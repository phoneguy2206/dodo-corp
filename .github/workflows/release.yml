name: Release Sonaris

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version de validation, par exemple v0.1.0-rc.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve and validate tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            echo "Expected vMAJOR.MINOR.PATCH, optionally followed by a pre-release suffix."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
          - platform: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      SONARIS_TAG: ${{ needs.metadata.outputs.tag }}
      SONARIS_VERSION: ${{ needs.metadata.outputs.version }}
      SONARIS_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check application syntax
        run: npm run check

      - name: Run Windows build script
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version $env:SONARIS_VERSION

      - name: Run Unix build script
        if: matrix.platform != 'windows'
        shell: bash
        run: bash "scripts/build-${SONARIS_PLATFORM}.sh" "$SONARIS_VERSION"

      - name: Verify release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/Sonaris-${SONARIS_VERSION}-${SONARIS_PLATFORM}.zip"
          if [[ ! -s "$archive" ]]; then
            echo "Expected non-empty archive not found: $archive"
            echo "Each platform build must create this exact file in dist/."
            exit 1
          fi
          echo "Verified $archive"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonaris-${{ matrix.platform }}-${{ needs.metadata.outputs.version }}
          path: dist/Sonaris-${{ needs.metadata.outputs.version }}-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Sonaris-*-${{ needs.metadata.outputs.version }}
          path: dist
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          for platform in windows macos linux; do
            test -s "dist/Sonaris-${{ needs.metadata.outputs.version }}-${platform}.zip"
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "dist/Sonaris-${RELEASE_VERSION}-windows.zip"
            "dist/Sonaris-${RELEASE_VERSION}-macos.zip"
            "dist/Sonaris-${RELEASE_VERSION}-linux.zip"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "Sonaris $RELEASE_TAG" \
              --generate-notes
          fi
